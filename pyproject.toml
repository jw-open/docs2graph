[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2graph"
version = "0.3.0"
description = "Extract knowledge graphs from documents. Rank relevant nodes with Personalized PageRank for LLM context. No LLM dependency — bring your own model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
benchmark = [
    "requests>=2.28.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=9.0",
]
pdf = [
    "pytesseract>=0.3.10",
    "Pillow>=9.0",
    "pdf2image>=1.16",
]
docx = [
    "python-docx>=0.8.11",
]
pptx = [
    "python-pptx>=0.6.21",
]

[project.urls]
Repository = "https://github.com/jw-open/doc2graph"

[tool.setuptools.packages.find]
where = ["."]
include = ["doc2graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
