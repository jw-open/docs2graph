[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2graph"
version = "0.1.0"
description = "Extract knowledge graphs from documents. Rank relevant nodes with Personalized PageRank for LLM context. No LLM dependency — bring your own model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
benchmark = [
    "requests>=2.28.0",
]

[project.urls]
Repository = "https://github.com/jw-open/doc2graph"

[tool.setuptools.packages.find]
where = ["."]
include = ["doc2graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
